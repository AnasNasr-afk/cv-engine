# German Master's application (uni-assist / Lebenslauf).
#
# `layout = "tabular"` switches the renderer to the German Lebenslauf
# form: dates down a fixed left column, a personal-data block under the
# name, and a Languages section. Roles without this key render the
# one-page bullet CV exactly as before.
#
# Weighting rationale. This document is read by an admissions committee
# against a Software Architecture curriculum, not by a recruiter filling
# a platform-specific seat. So architecture, engineering practice and
# academic signals lead, and no platform is suppressed -- breadth across
# iOS, Flutter and web is evidence of CS range, which is precisely what
# the degree-suitability criterion rewards.

name   = "Master's Application (Lebenslauf)"
label  = "masters"
layout = "tabular"

[boost]
architecture = 2.0
academic     = 1.8
leadership   = 1.6
backend      = 1.5
performance  = 1.4
security     = 1.4
industry     = 1.4
sdui         = 1.4
core         = 1.3
shipped      = 1.3
award         = 1.3
experimentation = 1.3
opensource   = 1.2
ai           = 1.1
ios          = 1.1
flutter      = 1.1
web          = 1.1
mobile       = 1.0
teaching     = 1.4
research     = 1.2

[sections]
order = ["education", "experience", "projects", "skills", "languages", "leadership"]

[limits]
education_bullets_max  = 4     # grade, credits and coursework all matter here
experience_bullets_max = 5
projects_max           = 4     # RASM, InsideOut, Sound'sCool, CairoCrew
project_bullets_max    = 1
skills_max             = 5
leadership_max         = 2
