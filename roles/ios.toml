# iOS Engineer.
#
# `boost` multiplies a bullet's weight for each tag it carries. Tags not
# listed default to 1.0. Values below 1.0 demote without removing --
# Flutter work still appears on an iOS CV, just lower and trimmed.

name  = "iOS Engineer"
label = "ios"

[boost]
ios            = 2.5
swift          = 2.5
mobile         = 1.6
architecture   = 1.4
performance    = 1.3
experimentation = 1.3
ui             = 1.2
industry       = 1.3
flutter        = 0.7
dart           = 0.6
web            = 0.35
react          = 0.3
typescript     = 0.4
backend        = 0.6

award          = 1.5
shipped        = 1.3
ai             = 1.1

[sections]
order = ["education", "experience", "skills", "projects", "leadership"]

[limits]
experience_bullets_max = 5   # per job
projects_max           = 4
project_bullets_max    = 1
skills_max             = 5
leadership_max         = 1
