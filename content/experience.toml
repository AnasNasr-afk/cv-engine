# Work experience.
#
# Each [[entry]] is a job. Each [[entry.bullets]] is one achievement line.
#
#   tags      what kind of work this is. Roles boost/suppress by tag.
#   weight    your own 0-10 sense of how strong the bullet is, before
#             the role multiplier is applied.
#   evidence  commit / PR references backing the claim. Empty means the
#             claim is currently unverified -- `make audit` reports these.
#
# Text is preserved verbatim from the Overleaf CV. Nothing here has been
# rewritten. See `make audit` for where the evidence supports more than
# the wording currently claims.

# Gym-Z: multi-tenant gym-management SaaS for the Egyptian market. Started
# 25 Oct 2026, mobile only (Flutter member and coach apps). Fit99 is the
# first custom gym, with its own app copied from GymZ-MemberApp.
[[entry]]
org      = "Gym-Z"
location = "Remote"
role     = "Flutter Engineer"
dates    = "Oct 2026 -- Present"
tags     = ["flutter", "mobile", "industry", "shipped"]
weight   = 10

  # Short on purpose: one month in (Anas, Nov 2026). Ownership and value
  # first. Chat is named as a feature of the apps he owns, not as his
  # build: the Socket.io chat predates him; his commits restyled it. "Release" = Google Play closed testing (member live with
  # testers 29 Oct, coach submitted the same day); not production yet.
  [[entry.bullets]]
  id       = "fit99-white-label"
  text     = "Designed the \\textbf{mobile architecture} for the Gym-Z SaaS: each partner gym gets its own branded member and coach apps from one shared codebase"
