  text     = "Owned the Fit99 apps from redesign to \\textbf{Google Play} release: 8 screens redesigned, plus real-time \\textbf{Socket.io} chat between members and coaches"
  tags     = ["flutter", "mobile", "release", "shipped", "ownership"]
  weight   = 9
  evidence = ["Gym-Z/Fit99-MemberApp#3"]

