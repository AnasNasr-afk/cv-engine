# Work experience.
#
# Each [[entry]] is a job. Each [[entry.bullets]] is one achievement line.
#
#   tags      what kind of work this is. Roles boost/suppress by tag.
#   weight    your own 0-10 sense of how strong the bullet is, before
#             the role multiplier is applied.
#   evidence  commit / PR references backing the claim. Empty means the
#             claim is currently unverified -- `make audit` reports these.
#
# Text is preserved verbatim from the Overleaf CV. Nothing here has been
# rewritten. See `make audit` for where the evidence supports more than
# the wording currently claims.

# Gym-Z: multi-tenant gym-management SaaS for the Egyptian market. Started
# 25 Oct 2026, mobile only (Flutter member and coach apps). Fit99 is the
# first custom gym, with its own app copied from GymZ-MemberApp.
[[entry]]
org      = "Gym-Z"
location = "Remote"
role     = "Mobile Engineer"
dates    = "Oct 2026 -- Present"
tags     = ["flutter", "mobile", "industry", "shipped"]
weight   = 10

  # "Built", not "launched": the member app is in Play closed testing,
  # production access opens mid-November at the earliest.
  [[entry.bullets]]
  id       = "fit99-white-label"
  text     = "Built \\textbf{Fit99}, a white-label member app for a partner gym, from the GymZ \\textbf{Flutter} codebase: new design system with light and dark tokens, bundled fonts, icon and splash, in English and Arabic"
  tags     = ["flutter", "dart", "mobile", "ui", "architecture", "shipped"]
  weight   = 9
  evidence = [
    "Gym-Z/Fit99-MemberApp#1",
    "Gym-Z/Fit99-MemberApp#2",
  ]

  [[entry.bullets]]
  id       = "fit99-screens"
  text     = "Redesigned Home, Workouts, Guests and Workout Log with \\textbf{Cubit}: subscription states (frozen, unpaid, ending soon), class booking, freeze and unfreeze, and a fix for visit times shown in UTC"
  tags     = ["flutter", "dart", "mobile", "ui", "product", "debugging"]
  weight   = 9
  evidence = [
    "Gym-Z/Fit99-MemberApp#2",
    "Gym-Z/Fit99-MemberApp#3",
  ]

  # Play Console work leaves no commits. The member app's closed test went
  # live 29 Oct with 12 testers; the coach app was submitted the same day.
  [[entry.bullets]]
  id       = "fit99-play-release"
  text     = "Took the Fit99 member and coach apps to \\textbf{Google Play} closed testing: signing, data safety, health and content-rating declarations, and store listings"
  tags     = ["flutter", "mobile", "release", "shipped"]
  weight   = 8
  evidence = []

